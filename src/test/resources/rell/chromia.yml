definitions:
  token_bridge_config: &common_config
    module: evm_token_bridge
    moduleArgs:
      lib.ft4.core.admin:
        admin_pubkey: 0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57
      lib.ft4.core.auth:
        evm_signatures_authorized_operations:
          - eif.hbridge.link_evm_eoa_account
      lib.hbridge:
        version: 2
    config:
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.eif.EifGTXModule"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      icmf:
        receiver:
          local:
            - topic: L_evm_block_events
              bc-rid: ICMF_SENDER_BRID

blockchains:
  evm_token_bridge: *common_config
  fake_evm_token_bridge: *common_config

libs:
  com.chromia.ft4:
    version: 1.1.0
  com.chromia.eif:
    version: 1.0.0
  com.chromia.hbridge:
    version: 1.0.0
  com.chromia.iccf:
    version: 1.90.1
  com.chromia.icmf:
    version: 1.102.2

compile:
  rellVersion: 0.14.5
