Configuration:
  name: Default
  properties:
    property:
      - name: pattern
        value: "%-5level %d{yyyy-MM-dd HH:mm:ss.SSS}%notEmpty{ bcRid=%X{bcRid}} %msg%n"

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: ${pattern}

    File:
      - name: FileAppender
        fileName: "logs/test.log"
        append: false
        PatternLayout:
          pattern: ${pattern}

  Loggers:
    Root:
      level: info
      additivity: false
      AppenderRef:
        - ref: FileAppender

    Logger:
      - name: TestLogger
        level: info
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: FileAppender
