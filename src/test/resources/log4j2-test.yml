Configuration:
  name: Default

  Appenders:
    Console:
      - name: ConsoleAppender
        target: SYSTEM_OUT
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"

    File:
      - name: FileAppender
        fileName: "logs/test.log"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} +++ %msg +++%n"
      - name: eif_node1_appender
        fileName: "logs/eif/deposit_node1.log"
        PatternLayout:
          Pattern: "%msg%n"

  Loggers:

    Root:
      level: info
      additivity: false
      AppenderRef:
        - ref: FileAppender

    Logger:
      - name: test_logger
        level: info
        additivity: false
        AppenderRef:
          - ref: ConsoleAppender
          - ref: FileAppender

      # Deposit tests
      - name: eif_node1_logger
        level: info
        additivity: false
        AppenderRef:
          - ref: eif_node1_appender
