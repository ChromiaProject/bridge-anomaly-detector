        # corresponding private key for this test key is FD8F9D4F1327DA6622B969DDD835CB41C982FAA805E614D7F4F4F0ADBCAD135F
        pool_account_pubkey: x"032FF500E33BC4DF87C7F40C167ADA6DBE52955066DD3F689189ED221B913BFD8F"
        # corresponding private key for this test key is F85AAB861F58BE75147768EFC59B07AD3365589C5F17AB2CCF917753B3CC6BC5
        deposit_account_pubkey: x"03559F5999D9F6C75590DC0008A36AE483D813E44EB7CE4984BDE01B90C9C2352E"
        # corresponding private key for this test key is E9CF8BC054D6F853FA9457D95EDBCA76EF52CEAD2913674031513FB015F5B5C0
        admin_pubkey: x"02552192E2FA6F1C1229EB74FBDC9F27EEB87641BA11B29F9094D4F729C081AFA3"
        chromia_foundation_account_pubkey: x"02552192E2FA6F1C1229EB74FBDC9F27EEB87641BA11B29F9094D4F729C081AFA3"
        staking_initial_reward_rate: 0.15
