Configuration:
  name: Default
  monitorInterval: 30 # sec.

  Appenders:
    Console:
      name: ConsoleAppender
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%-5level %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} -%replace{%notEmpty{ [%notEmpty{bc-rid=%.-2X{blockchainRID}:%.4X{blockchainRID}}%notEmpty{, chain-id=%X{chainIID}}%notEmpty{, block-rid=%.-2X{blockRID}:%.4X{blockRID}}]:}}{\\[, }{[} %msg%n"

  Loggers:

    Root:
      level: warn
      AppenderRef:
      - ref: ConsoleAppender

    Logger:

    - name: net.postchain
      level: debug
      additivity: false
      AppenderRef:
      - ref: ConsoleAppender

    - name: net.postchain.base.BaseBlockchainProcessManager
      level: debug
      additivity: false
      AppenderRef:
      - ref: ConsoleAppender

    - name: net.postchain.network.x.DefaultXCommunicationManager
      level: info
      additivity: false
      AppenderRef:
      - ref: ConsoleAppender

    - name: net.postchain.managed.ManagedBlockchainConfigurationProvider
      level: debug
      additivity: false
      AppenderRef:
        - ref: ConsoleAppender
