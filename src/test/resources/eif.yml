blockchains:
  eif_event_receiver:
    module: eif_event_receiver_chain_common
    config:
      features:
        merkle_hash_version: 2
      gtx:
        modules:
          - "net.postchain.eif.EifGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      sync_ext:
        - "net.postchain.eif.EifSynchronizationInfrastructureExtension"
      eif:
        chains:
          ethereum:
            network_id: 1337
            contracts:
              - EIF_EVENT_RECEIVER_CONTRACT_PLACEHOLDER
            skip_to_height: 0
            evm_read_offset: 0
            read_offset: 0
            events: !include ../../../target/postchain-eif-rell/rell/configs/events.yml

compile:
  rellVersion: 0.14.5
