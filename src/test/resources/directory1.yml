blockchains:
  manager:
    module: management_chain_directory1
    moduleArgs:
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      common.init:
        initial_provider: x"03ECD350EEBC617CBBFBEF0A1B7AE553A748021FD65C7C50C5ABB4CA16D4EA5B05"
        genesis_node:
          - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
          - node1
          - 9871
          - "http://node1:7740"
          - ""
      proposal_blockchain.util:
        max_config_path_depth: 10
        max_config_size: 2097152 # 2 MiB
    config:
      signers:
        - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      config_consensus_strategy: HEADER_HASH
      fast_revolt_status_timeout: 1000
      blockstrategy:
        maxblocktime: 2000
      sync_ext:
        - net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension
      gtx:
        modules:
          - net.postchain.d1.icmf.IcmfReceiverGTXModule
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
              - G_last_anchored_heights
  system_anchoring:
    module: anchoring_chain_system
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.system.SystemAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
  cluster_anchoring:
    module: anchoring_chain_cluster
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
        maxblocktransactions: 500
        name: "net.postchain.d1.anchoring.AnchoringBlockBuildingStrategy"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.anchoring.cluster.ClusterAnchoringGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
      icmf:
        receiver:
          global:
            topics:
              - G_get_last_anchored_heights
  mainnet:
    module: management_chain_mainnet
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
      revolt:
        fast_revolt_status_timeout: 1000
      signers:
        - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.eif.transaction.signerupdate.directorychain.SignerUpdateGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_configuration_updated
              - G_configuration_failed
              - G_last_anchored_heights
          global:
            topics:
              - G_create_cluster
              - G_create_container
              - G_upgrade_container
              - G_stop_container
              - G_restart_container
    moduleArgs:
      common:
        allow_blockchain_dependencies: false
        provider_quota_max_actions_per_day: 100
      common.init:
        initial_provider: x"03ECD350EEBC617CBBFBEF0A1B7AE553A748021FD65C7C50C5ABB4CA16D4EA5B05"
        genesis_node:
          - x"0350fe40766bc0ce8d08b3f5b810e49a8352fdd458606bd5fafe5acdcdc8ff3f57"
          - node1
          - 9871
          - "http://node1:7740"
          - ""
      proposal_blockchain.util:
        max_config_path_depth: 10
        max_config_size: 2097152 # 2 MiB
  economy_chain:
    module: economy_chain
    config:
      config_consensus_strategy: HEADER_HASH
      blockstrategy:
        maxblocktime: 2000
      revolt:
        fast_revolt_status_timeout: 2000
      sync_ext:
        - "net.postchain.d1.icmf.IcmfReceiverSynchronizationInfrastructureExtension"
      gtx:
        modules:
          - "net.postchain.d1.icmf.IcmfReceiverGTXModule"
          - "net.postchain.d1.icmf.IcmfSenderGTXModule"
      icmf:
        receiver:
          anchoring:
            topics:
              - G_node_availability_report
          directory-chain:
            topics:
              - L_create_cluster_error
              - L_ticket_container_result
              - L_cluster_update
              - L_provider_update
              - L_node_update
              - L_cluster_node_update
    moduleArgs:
