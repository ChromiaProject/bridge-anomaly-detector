# EVM
# Clients
evm_client.connect_timeout_seconds = 10
evm_client.read_timeout_seconds = 10
evm_client.write_timeout_seconds = 10

# Network properties on format evm.<network-id>.<property>

# List of evm rpc urls separated by comma
evm.1.rpc_urls = http://localhost:33253

# Private key can either be retrieved from node configuration file or set directly as property in this config
evm.1.node_config_file = ../directory1-example/config/config.0.properties
#evm.1.node_private_key = D0D0

# Never read beyond head-readOffset blocks
evm.1.log.readOffset=100

# Block range to request as maximum per log request
evm.1.log.maxBlockRangePerRequest=500

# Idling delay between log poll
evm.1.log.delayWhenNoNewBlock=10000

# Postchain node API URL and public key
postchain.url = http://localhost:7740
postchain.node_pubkey = 03ECD350EEBC617CBBFBEF0A1B7AE553A748021FD65C7C50C5ABB4CA16D4EA5B05
# Interval in milliseconds to query the blockchain for bridges to monitor
postchain.bridge_chain_refresh_interval = 1200000

# Bridge anomaly detector
# Specified in minutes - 24h
missing_height_retry_delay_minutes=1440
# Specified in minutes - 2h
pause_delay_minutes=120
# Add a random delay in seconds between 0-max_random_delay_seconds to keep detectors pause the bridge at the same time
max_random_delay_seconds=300
# When set to false the monitor still identifies anomalies but will never actually pause the bridge. Enable for testing
# or manual intervention when an anomaly is found.
#pause_on_anomaly=false

# Port used by REST API server, -1 to disable
rest_api.port = 7790
